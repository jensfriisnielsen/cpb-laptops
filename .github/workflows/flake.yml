# CI: prove the flake still evaluates and a managed-laptop config still builds.
#
# This job is a *test only*. It never runs `nix flake update` and passes
# `--no-update-lock-file` everywhere, so an out-of-date flake.lock fails the
# build instead of being silently rewritten. Bumping inputs stays a manual,
# reviewed change.
name: flake

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/**"
      - "hosts/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/flake.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/**"
      - "hosts/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/flake.yml"
  workflow_dispatch:

concurrency:
  group: flake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Lock must already be complete and current. --no-update-lock-file turns a
      # stale or missing entry into an error rather than a silent rewrite.
      - name: flake.lock is current
        run: nix flake metadata --no-update-lock-file

      # Evaluate every output, including all 40 nixosConfigurations, without
      # building. Catches module option typos, bad args, eval errors.
      - name: evaluate
        run: nix flake check --no-build --no-update-lock-file --show-trace

      # Actually compile one managed laptop end to end (koderup1 == the shared
      # config; the other hosts differ only by hostname and facter report).
      - name: build koderup1
        run: |
          nix build --no-update-lock-file --print-build-logs \
            '.#nixosConfigurations.koderup1.config.system.build.toplevel'
